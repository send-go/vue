name: Publish to npm

# vX.Y.Z 태그 push 또는 수동 실행 시 npm 으로 배포합니다.
# npm Trusted Publishing(OIDC) 사용 — 장기 토큰 불필요. 프로버넌스 자동 생성.
# 사전 조건: npmjs.com 각 패키지 설정에 Trusted Publisher(GitHub Actions, 이 repo, publish.yml) 등록.
# 태그와 Release를 함께 게시해도 중복 배포되지 않도록 태그만 자동 트리거합니다.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # OIDC 토큰 발급(Trusted Publishing 필수)
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"                       # >= 22.14 (Trusted Publishing 요구)
          registry-url: "https://registry.npmjs.org"

      - name: "npm 최신화 (Trusted Publishing 요구: npm >= 11.5.1)"
        run: npm install -g npm@latest

      - name: 의존성 설치
        run: npm install --no-audit --no-fund

      - name: 빌드 (tsc)
        run: npm run build

      - name: npm 배포 (OIDC)
        run: npm publish --access public
